name: Daily YouTube Report

on:
  schedule:
    # 9:00 AM KST is 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Set up cookies
      env:
        YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
      run: |
        if [ -n "$YOUTUBE_COOKIES" ]; then
          python3 -c "import os; open('cookies.txt', 'w', encoding='utf-8').write(os.environ['YOUTUBE_COOKIES'])"
          echo "Cookies set up successfully. Size: $(wc -c < cookies.txt) bytes"
        else
          echo "YOUTUBE_COOKIES secret is empty. Skipping cookies setup."
        fi

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Report Generator
      env:
        GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
        NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
        EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
        YOUTUBE_PO_TOKEN: ${{ secrets.YOUTUBE_PO_TOKEN }}
        YOUTUBE_USER_AGENT: ${{ secrets.YOUTUBE_USER_AGENT }}
      run: |
        python main.py --hours 24
